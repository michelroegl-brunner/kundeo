name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, typecheck and build the monorepo.
  build:
    runs-on: ubuntu-latest
    # Placeholders so `next build` / prisma generate run without a live DB or
    # real secrets. Runtime config is provided by the deployment, not the build.
    env:
      DATABASE_URL: "postgresql://build:build@localhost:5432/build?schema=public"
      DIRECT_URL: "postgresql://build:build@localhost:5432/build?schema=public"
      BETTER_AUTH_SECRET: "ci-placeholder-secret-not-used-at-runtime"
      BETTER_AUTH_URL: "http://localhost:3000"
      KUNDEO_ENCRYPTION_KEY: "ci-placeholder-key-not-used-at-runtime"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # Smoke-build the production image so Dockerfile breakage is caught on PRs.
  # No push here — publishing happens in release.yml on tag/release.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
