# Local development database. For a full self-host stack (app + db) a
# production compose file will live in deploy/ once the app image is built.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kundeo
      POSTGRES_PASSWORD: kundeo
      POSTGRES_DB: kundeo
    # Host port 5434 (localhost only) to avoid clashing with other local
    # Postgres instances (e.g. a default one on 5432).
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - kundeo_pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kundeo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kundeo_pgdata:
